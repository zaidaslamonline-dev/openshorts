name: GTA 6 VOD to MP4 (CPU test)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gta6-mp4-test.yml"
      - "main.py"
      - "requirements*.txt"
      - "Dockerfile"
      - "**/*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta6-mp4-test
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out production-test branch
        uses: actions/checkout@v4
        with:
          ref: gta6-production-test

      - name: Set up the public test VOD
        run: |
          echo "SOURCE_URL=https://www.youtube.com/watch?v=-KbQj_vboOU" >> "$GITHUB_ENV"
          echo "Using the CC BY sample video documented by the upstream OpenShorts README."

      - name: Show runner capacity and free disk
        run: |
          echo "CPU: $(nproc)"
          free -h
          df -h /

      - name: Build the project's CPU Docker image
        run: |
          docker build --build-arg GPU=0 --tag openshorts-cpu:gta6-test .

      - name: Run OpenShorts on the sample VOD
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Gemini key found: running AI clip selection + rendering."
            docker run --rm --shm-size=2g \
              -e GEMINI_API_KEY \
              -e WHISPER_MODEL=base \
              -e WHISPER_DEVICE=cpu \
              -e WHISPER_COMPUTE=int8 \
              -e CLIP_WORKERS=1 \
              -e FFMPEG_THREADS=2 \
              -e AUTO_LAYOUT=0 \
              -v "$GITHUB_WORKSPACE/output:/app/output" \
              openshorts-cpu:gta6-test \
              python main.py --url "$SOURCE_URL" --output /app/output --keep-original
          else
            echo "::warning::GEMINI_API_KEY is not configured. Running the real download + CPU reframing/export path without AI moment selection."
            docker run --rm --shm-size=2g \
              -e WHISPER_MODEL=base \
              -e WHISPER_DEVICE=cpu \
              -e WHISPER_COMPUTE=int8 \
              -e CLIP_WORKERS=1 \
              -e FFMPEG_THREADS=2 \
              -e AUTO_LAYOUT=0 \
              -v "$GITHUB_WORKSPACE/output:/app/output" \
              openshorts-cpu:gta6-test \
              python main.py --url "$SOURCE_URL" --output /app/output --keep-original --skip-analysis
          fi

      - name: Verify MP4 output exists and is non-empty
        run: |
          find output -type f -name '*.mp4' -size +0c -print
          count="$(find output -type f -name '*.mp4' -size +0c | wc -l)"
          if [ "$count" -lt 1 ]; then
            echo "::error::Pipeline finished without producing an MP4."
            exit 1
          fi
          echo "Verified $count non-empty MP4 file(s)."

      - name: Upload MP4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta6-clips-mp4
          path: output/**/*.mp4
          if-no-files-found: error
          retention-days: 1
